spring:
  application:
    name: payment-fee-service

  # Default profile: in-memory H2, zero setup required for local dev
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true

server:
  port: 8080

---
# Docker / Postgres profile — activated via SPRING_PROFILES_ACTIVE=docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/paymentdb
    driver-class-name: org.postgresql.Driver
    # Read from environment variables (set in docker-compose.yml),
    # falling back to the local dev defaults.
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:payment_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # Dev-only tools: off in the Postgres profile.
  h2:
    console:
      enabled: false
  graphql:
    graphiql:
      enabled: false
