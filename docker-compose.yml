services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${POSTGRES_USER:-payment_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payment_pass}
    depends_on:
      db:
        # Wait until Postgres is actually accepting connections,
        # not just until its container has started.
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: ${POSTGRES_USER:-payment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_pass}
    ports:
      - "5432:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payment_db_data:
